# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.0.4"

package:
  name: graphed-histogram
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/graphed-histogram/graphed_histogram-${{ version }}.tar.gz
  sha256: bbdbd55434e877a46985aa7a1e848e90d8b9e602f49c40c51b305baeaa374983

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - graphed >=0.0.2
    - boost-histogram >=1.4
    - numpy >=1.24

tests:
  - python:
      imports:
        - graphed_histogram
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - python -c "import graphed_histogram as gh; print(gh.factory)"

about:
  summary: Deferred boost-histogram/hist filling on graphed task graphs
  description: |
    The dask-histogram analogue for graphed: boost-histogram and hist objects are filled
    lazily inside a graphed plan, so the fill is a node in the task graph and is combined
    with a tree reduction at execute time.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/graphed-org/graphed-histogram
  repository: https://github.com/graphed-org/graphed-histogram
  documentation: https://graphed-histogram.readthedocs.io

extra:
  recipe-maintainers:
    - lgray
